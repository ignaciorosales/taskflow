# docker compose up --build   →   http://localhost:8080
services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  identity-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        PROJECT: TaskFlow.Identity.Api
    environment: &api-environment
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: taskflow
      # Local demo key only; set JWT_KEY to override it anywhere real.
      Jwt__Key: ${JWT_KEY:-local-demo-signing-key-change-me-for-real-use}
    depends_on:
      mongo:
        condition: service_healthy

  tasks-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        PROJECT: TaskFlow.Tasks.Api
    environment: *api-environment
    depends_on:
      mongo:
        condition: service_healthy

  # The only published port: the APIs are reachable through nginx alone.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - identity-api
      - tasks-api

  # Optional database browser for demos: docker compose --profile tools up -d → http://localhost:8081
  # Off by default, bound to this machine only, and behind a login since it can edit data.
  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-taskflow-demo}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
