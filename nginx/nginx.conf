# The browser sees one origin: no CORS, and the refresh cookie stays first-party.
server {
    listen 80;

    # Overwrite, never append: the APIs rate limit on this, so clients must not be able to spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    location /api/auth/ {
        proxy_pass http://identity-api:8080;
    }

    location /api/tasks {
        proxy_pass http://tasks-api:8080;
    }

    # The React app; unknown paths fall back to it.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Hashed file names never change, so they can be cached for good.
    location /assets/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, immutable";
    }
}
