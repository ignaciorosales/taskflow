# The browser sees one origin: no CORS, and the refresh cookie stays first-party.
server {
    listen 80;

    # Overwrite, never append: the APIs rate limit on this, so clients must not be able to spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    location /api/auth/ {
        proxy_pass http://identity-api:8080;
    }

    location /api/tasks {
        proxy_pass http://tasks-api:8080;
    }

    # The React app is served from here in step 10.
    location / {
        default_type text/plain;
        return 200 "TaskFlow API is up. The web app arrives in step 10.\n";
    }
}
