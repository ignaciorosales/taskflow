name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # The runner has Docker, so the Testcontainers tests start a real Mongo.
      - run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The README promises one command; this runs it and logs in as the demo through nginx.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Demo login through nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -X POST http://localhost:8080/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"email":"demo@taskflow.dev","password":"Demo123!"}' > /dev/null; then
              echo "Demo login works"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
